<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Création de séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E60}a:hover{color:#0A5248}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F4; font-family: Inter, system-ui, sans-serif; color: #1E2226; overflow: hidden; position: relative">

<header style="background: #23272B; color: #FFFFFF; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #2C3135; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>
</a>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 12px; color: #B9C2C6">Mardi 27 octobre · 18h30</span>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px">Séance U15</h1>
</div>
<span style="font-size: 12px; font-weight: 600; background: #5CC6B1; color: #12312C; border-radius: 999px; padding: 5px 10px">Cycle 2 · S3</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B9C2C6; text-transform: uppercase; letter-spacing: 0.8px">Thème</span>
<input type="text" value="Défense sur porteur de balle" style="height: 46px; border-radius: 12px; border: 1px solid #3A4045; background: #2C3135; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; padding: 0 14px">
</label>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px">
<span style="color: #D4DADC">Durée planifiée</span>
<span style="font-weight: 700; color: #5CC6B1">90 / 90 min</span>
</div>
<div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px">
<div style="width: 16.6%; background: #F2A93B"></div>
<div style="width: 22.2%; background: #6FA8F5"></div>
<div style="width: 22.2%; background: #5CC6B1"></div>
<div style="width: 27.8%; background: #B79CF2"></div>
<div style="width: 11.2%; background: #9AA5AA"></div>
</div>
</div>
</header>

<main style="flex-grow: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="5">
<div style="background: #FFFFFF; border-radius: 14px; padding: 12px 12px 12px 8px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(20,30,35,0.06)">
<button aria-label="Déplacer l'exercice" style="width: 28px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#9AA5AA" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
</button>
<span style="width: 12px; height: 12px; border-radius: 4px; background: {{b.color}}; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: #5B656B; text-transform: uppercase; letter-spacing: 0.6px">{{b.part}}</span>
<span style="font-size: 15px; font-weight: 600">{{b.name}}</span>
</div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #23272B; flex-shrink: 0">{{b.min}}</span>
</div>
</sc-for>
<button style="height: 50px; border-radius: 14px; border: 2px dashed #9FB3B0; background: transparent; color: #0F6E60; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
Ajouter depuis la bibliothèque</button>
</main>

<footer style="background: #FFFFFF; border-top: 1px solid #E1E6E6; padding: 12px 20px 26px; display: flex; gap: 10px">
<button onClick="{{openDup}}" style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #C9D2D2; background: #FFFFFF; color: #23272B; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Dupliquer vers…</button>
<button style="flex: 1; height: 50px; border-radius: 14px; border: none; background: #23272B; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Enregistrer</button>
</footer>

<sc-if value="{{dupOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(20,24,27,0.55); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-label="Dupliquer la séance" style="background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 20px 20px 30px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Dupliquer vers d'autres équipes</h2>
<span style="font-size: 14px; color: #4A545A">La séance est copiée sur le prochain créneau de chaque équipe choisie.</span>
<sc-for list="{{teams}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.toggle}}" style="min-height: 52px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.bg}}; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-family: inherit; cursor: pointer">
<span style="display: flex; flex-direction: column; align-items: flex-start">
<span style="font-size: 15px; font-weight: 600; color: #1E2226">{{t.name}}</span>
<span style="font-size: 12px; color: #4A545A">{{t.slot}}</span>
</span>
<span style="font-size: 13px; font-weight: 700; color: #0F6E60">{{t.mark}}</span>
</button>
</sc-for>
<div style="display: flex; gap: 10px">
<button onClick="{{closeDup}}" style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #C9D2D2; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #23272B; cursor: pointer">Annuler</button>
<button onClick="{{closeDup}}" style="flex: 1; height: 50px; border-radius: 14px; border: none; background: #5CC6B1; color: #12312C; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{dupLabel}}</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dupOpen: false, picked: { u13: false, u17: true, u18: false } };
  }
  renderVals() {
    const blocks = [
      { part: 'Échauffement', name: 'Gammes dribble + mobilité', min: '15′', color: '#F2A93B' },
      { part: 'Fondamentaux', name: 'Pas glissés et contest', min: '20′', color: '#6FA8F5' },
      { part: 'Thème', name: '1c1 sur porteur, ligne de fond', min: '20′', color: '#5CC6B1' },
      { part: 'Jeu', name: '3c3 demi-terrain, aide au porteur', min: '25′', color: '#B79CF2' },
      { part: 'Retour au calme', name: 'Lancers francs + étirements', min: '10′', color: '#9AA5AA' }
    ];
    const defs = [
      { id: 'u13', name: 'U13', slot: 'Mercredi 28 oct · 14h00' },
      { id: 'u17', name: 'U17', slot: 'Mercredi 28 oct · 18h30' },
      { id: 'u18', name: 'U18', slot: 'Jeudi 29 oct · 19h30' }
    ];
    const picked = this.state.picked;
    const teams = defs.map((d) => {
      const on = !!picked[d.id];
      return {
        name: d.name, slot: d.slot,
        border: on ? '#2FA892' : '#E1E6E6',
        bg: on ? '#E6F5F1' : '#FFFFFF',
        mark: on ? 'Sélectionnée' : 'Choisir',
        toggle: () => this.setState({ picked: Object.assign({}, picked, { [d.id]: !on }) })
      };
    });
    const n = defs.filter((d) => picked[d.id]).length;
    return {
      blocks, teams,
      dupOpen: this.state.dupOpen,
      dupLabel: n > 1 ? 'Dupliquer (' + n + ' équipes)' : 'Dupliquer (' + n + ' équipe)',
      openDup: () => this.setState({ dupOpen: true }),
      closeDup: () => this.setState({ dupOpen: false })
    };
  }
}
</script>
</body>
</html>
