<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion par code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CC6B1}a:hover{color:#8FDCCC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background: #23272B; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; padding: 44px 28px 32px; gap: 22px; overflow: hidden">

<img src="../public/logo-bvb.jpeg" alt="Logo BVB Le Poiré - Les Lucs" style="width: 112px; height: 112px; object-fit: contain; background: #FFFFFF; border-radius: 28px; padding: 8px; box-sizing: border-box">

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 0.5px">Espace club BVB</h1>
<span style="font-size: 14px; color: #B9C2C6">Le Poiré - Les Lucs</span>
</div>

<button style="width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid #3A4045; background: #2C3135; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 14px; cursor: pointer; font-family: inherit">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #5CC6B1; color: #12312C; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">DB</span>
<span style="display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">Dimitri Blanchard</span>
<span style="font-size: 12px; color: #B9C2C6">Entraîneur · Administrateur</span>
</span>
<span style="font-size: 13px; font-weight: 600; color: #5CC6B1">Changer</span>
</button>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="font-size: 14px; color: #D4DADC">{{prompt}}</span>
<div style="display: flex; gap: 18px" aria-live="polite">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<span style="{{d.style}}"></span>
</sc-for>
</div>
</div>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a href="Main.dc.html" style="width: 100%; height: 52px; border-radius: 14px; background: #5CC6B1; color: #12312C; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Entrer dans l'app</a>
</sc-if>

<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: auto">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button onClick="{{k.press}}" aria-label="{{k.label}}" style="height: 60px; border-radius: 16px; border: none; background: {{k.bg}}; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 28px; cursor: pointer">{{k.text}}</button>
</sc-for>
</div>

<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">Code oublié ? Demander à l'administrateur</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: '' };
  }
  renderVals() {
    const code = this.state.code;
    const done = code.length === 4;
    const dots = [0, 1, 2, 3].map((i) => ({
      style: 'width: 18px; height: 18px; border-radius: 999px; box-sizing: border-box; border: 2px solid ' + (i < code.length ? '#5CC6B1' : '#6B767C') + '; background: ' + (i < code.length ? '#5CC6B1' : 'transparent')
    }));
    const labels = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    const keys = labels.map((t) => ({
      text: t,
      label: t === '⌫' ? 'Effacer' : (t === '' ? 'Vide' : t),
      bg: t === '' ? 'transparent' : '#2F3439',
      press: () => {
        if (t === '') return;
        if (t === '⌫') { this.setState({ code: code.slice(0, -1) }); return; }
        if (code.length < 4) this.setState({ code: code + t });
      }
    }));
    return {
      dots, keys, done,
      prompt: done ? 'Code saisi — bienvenue !' : 'Entre ton code à 4 chiffres'
    };
  }
}
</script>
</body>
</html>
